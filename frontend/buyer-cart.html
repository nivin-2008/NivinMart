<body>
    <header>
        <h1>NivinMart</h1>
        <div id="buyerName"></div>
    </header>

    <div class="container">
        <h2 class="title">My Cart</h2>
        <p id="message">Loading cart...</p>
        <div id="cartContainer"></div>

        <div class="summary">
            <h2>Order Summary</h2>
            <div class="total" id="totalAmount">Total: ₹0</div>

            <button class="order-btn" onclick="placeOrder()">
                Place Order
            </button>
        </div>
    </div>

    <script>
        // Frontend and backend use the same Render service.
        const API_BASE = "";

        const buyerId = localStorage.getItem("buyerId");
        const buyerName = localStorage.getItem("buyerName");

        if (!buyerId) {
            window.location.href = "buyer-login.html";
        }

        document.getElementById("buyerName").textContent =
            "Welcome, " + (buyerName || "Buyer");

        async function apiFetch(path, options = {}) {
            return await fetch(API_BASE + path, options);
        }

        async function loadCart() {
            const container = document.getElementById("cartContainer");
            const message = document.getElementById("message");
            const totalAmount = document.getElementById("totalAmount");

            message.textContent = "Loading cart...";
            container.innerHTML = "";
            totalAmount.textContent = "Total: ₹0";

            try {
                const response = await apiFetch(
                    "/cart?buyer_id=" + encodeURIComponent(buyerId)
                );

                if (!response.ok) {
                    throw new Error("Cart request failed: " + response.status);
                }

                const data = await response.json();

                if (!data.success) {
                    message.textContent =
                        data.message || "Unable to load cart";
                    return;
                }

                const items = data.cart || data.items || [];

                if (items.length === 0) {
                    message.textContent = "Your cart is empty.";
                    return;
                }

                message.textContent = "";
                let total = 0;

                items.forEach(item => {
                    const price = Number(item.price || 0);
                    const quantity = Number(item.quantity || 1);
                    const productId = Number(item.product_id);

                    total += price * quantity;

                    const div = document.createElement("div");
                    div.className = "cart-item";

                    const info = document.createElement("div");
                    info.className = "item-info";

                    const name = document.createElement("h2");
                    name.textContent =
                        item.name || item.product_name || "Product";

                    const priceText = document.createElement("p");
                    priceText.textContent =
                        "Price: ₹" + price.toFixed(2);

                    const subtotalText = document.createElement("p");
                    subtotalText.textContent =
                        "Subtotal: ₹" + (price * quantity).toFixed(2);

                    info.append(name, priceText, subtotalText);

                    const quantityDiv = document.createElement("div");
                    quantityDiv.className = "quantity";

                    const minus = document.createElement("button");
                    minus.type = "button";
                    minus.textContent = "-";
                    minus.onclick = () =>
                        changeQuantity(productId, quantity - 1);

                    const quantityText = document.createElement("span");
                    quantityText.textContent = quantity;

                    const plus = document.createElement("button");
                    plus.type = "button";
                    plus.textContent = "+";
                    plus.onclick = () =>
                        changeQuantity(productId, quantity + 1);

                    quantityDiv.append(minus, quantityText, plus);

                    const remove = document.createElement("button");
                    remove.type = "button";
                    remove.className = "remove-btn";
                    remove.textContent = "Remove";
                    remove.onclick = () => removeItem(productId);

                    div.append(info, quantityDiv, remove);
                    container.appendChild(div);
                });

                totalAmount.textContent =
                    "Total: ₹" + total.toFixed(2);

            } catch (error) {
                console.error("Load cart error:", error);
                message.textContent =
                    "Cannot connect to backend. Please try again.";
            }
        }

        async function changeQuantity(productId, quantity) {
            if (quantity < 1) {
                await removeItem(productId);
                return;
            }

            try {
                const response = await apiFetch("/cart/update", {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        buyer_id: Number(buyerId),
                        product_id: Number(productId),
                        quantity: Number(quantity)
                    })
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    alert(data.message || "Unable to update cart");
                    return;
                }

                await loadCart();

            } catch (error) {
                console.error("Update cart error:", error);
                alert("Cannot connect to backend");
            }
        }

        async function removeItem(productId) {
            try {
                const response = await apiFetch("/cart/remove", {
                    method: "DELETE",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        buyer_id: Number(buyerId),
                        product_id: Number(productId)
                    })
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    alert(data.message || "Unable to remove item");
                    return;
                }

                await loadCart();

            } catch (error) {
                console.error("Remove cart item error:", error);
                alert("Cannot connect to backend");
            }
        }

        function placeOrder() {
            window.location.href = "buyer-place-order.html";
        }

        if (buyerId) {
            loadCart();
        }
    </script>
</body>
</html>
