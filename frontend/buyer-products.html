<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Buyer Products - NivinMart</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            min-height: 100vh;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        header h1 {
            font-size: 28px;
        }

        .welcome {
            font-size: 15px;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 35px auto;
        }

        .page-title {
            font-size: 32px;
            margin-bottom: 25px;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .toolbar input {
            flex: 1;
            min-width: 180px;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 14px;
        }

        .search-button,
        .orders-button,
        .cart-button {
            background: #111827;
            color: white;
        }

        .clear-button {
            background: #e5e7eb;
            color: #111827;
        }

        .search-button:hover,
        .orders-button:hover,
        .cart-button:hover {
            background: #374151;
        }

        .clear-button:hover {
            background: #d1d5db;
        }

        #message {
            margin-bottom: 22px;
            color: #444;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(260px, 1fr)
            );
            gap: 24px;
        }

        .product-card {
            background: white;
            padding: 24px;
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.07);
            display: flex;
            flex-direction: column;
        }

        .product-image {
            width: 100%;
            height: 190px;
            object-fit: contain;
            background: #f9fafb;
            border-radius: 10px;
            margin-bottom: 16px;
            cursor: pointer;
        }

        .product-card h2 {
            font-size: 22px;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .description {
            color: #666;
            line-height: 1.5;
            margin-bottom: 15px;
            overflow-wrap: anywhere;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .stock {
            color: #555;
            margin-bottom: 15px;
        }

        .rating-summary {
            color: #b45309;
            font-weight: bold;
            margin-bottom: 14px;
            line-height: 1.5;
        }

        .reviews-button {
            width: 100%;
            padding: 11px;
            margin-bottom: 12px;
            border: 1px solid #111827;
            background: white;
            color: #111827;
        }

        .reviews-button:hover {
            background: #f3f4f6;
        }

        .reviews-list {
            border-top: 1px solid #e5e7eb;
            padding-top: 12px;
            margin-bottom: 15px;
        }

        .review-item {
            background: #f9fafb;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            overflow-wrap: anywhere;
        }

        .review-item p {
            margin: 7px 0;
            line-height: 1.4;
        }

        .review-stars {
            color: #d97706;
            font-size: 17px;
        }

        .review-date {
            color: #777;
            font-size: 12px;
        }

        .cart-button {
            width: 100%;
            margin-top: auto;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .no-results {
            color: #666;
            font-size: 18px;
            padding: 20px 0;
        }

        @media (max-width: 600px) {
            header {
                padding: 20px;
            }

            .container {
                width: 92%;
            }

            .page-title {
                font-size: 27px;
            }

            .toolbar {
                flex-direction: column;
            }

            .toolbar input,
            .toolbar button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>NivinMart</h1>
    <div class="welcome" id="welcomeMessage"></div>
</header>

<div class="container">

    <h2 class="page-title">Products</h2>

    <div class="toolbar">

        <input
            type="text"
            id="searchInput"
            placeholder="Search products..."
        >

        <button
            type="button"
            class="search-button"
            onclick="searchProducts()">
            Search
        </button>

        <button
            type="button"
            class="clear-button"
            onclick="clearSearch()">
            Clear
        </button>

        <button
            type="button"
            class="orders-button"
            onclick="window.location.href='buyer-order-history.html'">
            My Orders
        </button>

    </div>

    <p id="message">Loading products...</p>

    <div class="products" id="productsContainer"></div>

</div>

<script>
    const buyerId = localStorage.getItem("buyerId");
    const buyerName = localStorage.getItem("buyerName");

    document.getElementById("welcomeMessage").textContent =
        "Welcome, " + (buyerName || "Buyer");

    let allProducts = [];

    // Store reviews so we do not repeatedly fetch the same product's reviews.
    const reviewCache = new Map();


    if (!buyerId) {
        window.location.href = "buyer-login.html";
    } else {
        loadProducts();
    }


    // Load products from the backend.
    async function loadProducts() {
        const message = document.getElementById("message");

        try {
            const response = await fetch("/products");

            const data = await response.json();

            if (!response.ok || !data.success) {
                message.textContent =
                    data.message || "Unable to load products.";
                return;
            }

            allProducts = data.products || [];

            displayProducts(allProducts);

        } catch (error) {
            console.error(error);
            message.textContent = "Cannot connect to backend.";
        }
    }


    // Display product cards.
    function displayProducts(products) {
        const container =
            document.getElementById("productsContainer");

        const message =
            document.getElementById("message");

        container.innerHTML = "";

        if (!products || products.length === 0) {
            message.textContent = "";

            const emptyMessage = document.createElement("p");
            emptyMessage.className = "no-results";
            emptyMessage.textContent = "No products found.";

            container.appendChild(emptyMessage);
            return;
        }

        message.textContent =
            products.length + " product(s) found";


        products.forEach(function(product) {
            const card = document.createElement("div");
            card.className = "product-card";

            // Product photo
            if (product.image_data) {
                const image = document.createElement("img");
                image.className = "product-image";
                image.src = product.image_data;
                image.alt = product.name || "Product photo";
                card.appendChild(image);
            }

            // Product name
            const title = document.createElement("h2");
            title.textContent = product.name || "Unnamed Product";

            // Product description
            const description = document.createElement("p");
            description.className = "description";
            description.textContent =
                product.description || "No description available.";

            // Product price
            const price = document.createElement("p");
            price.className = "price";

            const productPrice = Number(product.price);
            price.textContent = Number.isFinite(productPrice)
                ? "₹" + productPrice.toFixed(2)
                : "Price unavailable";

            // Product stock
            const stock = document.createElement("p");
            stock.className = "stock";
            stock.textContent = "Stock: " + product.stock;

            // Average rating
            const ratingSummary = document.createElement("p");
            ratingSummary.className = "rating-summary";
            ratingSummary.textContent = "Loading rating...";

            // Show/hide reviews button
            const reviewsButton = document.createElement("button");
            reviewsButton.type = "button";
            reviewsButton.className = "reviews-button";
            reviewsButton.textContent = "View Reviews";

            // Review list
            const reviewsList = document.createElement("div");
            reviewsList.className = "reviews-list";
            reviewsList.hidden = true;


            // Load rating summary in the background.
            getProductReviews(product.id)
                .then(function(reviews) {
                    updateRatingSummary(reviews, ratingSummary);
                    reviewsButton.textContent =
                        "View Reviews (" + reviews.length + ")";
                })
                .catch(function(error) {
                    console.error(error);
                    ratingSummary.textContent =
                        "Rating currently unavailable";
                });


            // View or hide the reviews.
            reviewsButton.addEventListener("click", async function() {
                if (!reviewsList.hidden) {
                    reviewsList.hidden = true;

                    const cachedReviews =
                        reviewCache.get(Number(product.id)) || [];

                    reviewsButton.textContent =
                        "View Reviews (" + cachedReviews.length + ")";

                    return;
                }

                reviewsList.hidden = false;
                reviewsList.textContent = "Loading reviews...";
                reviewsButton.textContent = "Hide Reviews";

                try {
                    const reviews =
                        await getProductReviews(product.id);

                    updateRatingSummary(reviews, ratingSummary);
                    renderReviews(reviews, reviewsList);

                    reviewsButton.textContent = "Hide Reviews";

                } catch (error) {
                    console.error(error);

                    reviewsList.textContent =
                        "Unable to load reviews. Please try again.";

                    reviewsButton.textContent = "Hide Reviews";
                }
            });


            // Clicking the product image or name opens that product's reviews.
            if (product.image_data) {
                const productImage = card.querySelector(".product-image");
                if (productImage) {
                    productImage.title = "Click to view ratings and reviews";
                    productImage.addEventListener("click", function() {
                        if (reviewsList.hidden) reviewsButton.click();
                        reviewsList.scrollIntoView({ behavior: "smooth", block: "nearest" });
                    });
                }
            }

            title.title = "Click to view ratings and reviews";
            title.addEventListener("click", function() {
                if (reviewsList.hidden) reviewsButton.click();
                reviewsList.scrollIntoView({ behavior: "smooth", block: "nearest" });
            });

            // Add to Cart button
            const cartButton = document.createElement("button");
            cartButton.type = "button";
            cartButton.className = "cart-button";
            cartButton.textContent = "Add to Cart";

            cartButton.addEventListener("click", function() {
                addToCart(product.id, cartButton);
            });


            card.appendChild(title);
            card.appendChild(description);
            card.appendChild(price);
            card.appendChild(stock);
            card.appendChild(ratingSummary);
            card.appendChild(reviewsButton);
            card.appendChild(reviewsList);
            card.appendChild(cartButton);

            container.appendChild(card);
        });
    }


    // Get reviews for one product.
    async function getProductReviews(productId) {
        const id = Number(productId);

        if (reviewCache.has(id)) {
            return reviewCache.get(id);
        }

        const response = await fetch(
            "/reviews?product_id=" + encodeURIComponent(id)
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || "Unable to load reviews.");
        }

        const reviews = Array.isArray(data.reviews)
            ? data.reviews
            : [];

        reviewCache.set(id, reviews);

        return reviews;
    }


    // Show average rating and number of reviews.
    function updateRatingSummary(reviews, element) {
        if (!reviews || reviews.length === 0) {
            element.textContent = "No ratings yet";
            return;
        }

        const totalRating = reviews.reduce(function(total, review) {
            return total + Number(review.rating || 0);
        }, 0);

        const average = totalRating / reviews.length;
        const stars = "★".repeat(Math.round(average)) +
            "☆".repeat(5 - Math.round(average));

        element.textContent =
            stars + " " + average.toFixed(1) + "/5 (" +
            reviews.length + " review" +
            (reviews.length === 1 ? "" : "s") + ")";
    }


    // Display individual buyer comments.
    function renderReviews(reviews, container) {
        container.innerHTML = "";

        if (!reviews || reviews.length === 0) {
            const empty = document.createElement("p");
            empty.textContent = "No reviews yet.";
            container.appendChild(empty);
            return;
        }

        reviews.forEach(function(review) {
            const item = document.createElement("div");
            item.className = "review-item";

            const buyer = document.createElement("p");
            buyer.textContent = review.buyer_name || "Buyer";

            const stars = document.createElement("p");
            stars.className = "review-stars";

            const rating = Math.max(
                0,
                Math.min(5, Number(review.rating) || 0)
            );

            stars.textContent =
                "★".repeat(rating) + "☆".repeat(5 - rating);

            const comment = document.createElement("p");
            comment.textContent =
                review.comment && review.comment.trim()
                    ? review.comment
                    : "No comment provided.";

            const date = document.createElement("p");
            date.className = "review-date";
            date.textContent = review.created_at
                ? "Date: " + review.created_at
                : "";

            item.appendChild(buyer);
            item.appendChild(stars);
            item.appendChild(comment);
            item.appendChild(date);

            container.appendChild(item);
        });
    }


    // Search products by name or description.
    function searchProducts() {
        const searchText = document.getElementById("searchInput")
            .value.trim().toLowerCase();

        if (searchText === "") {
            displayProducts(allProducts);
            return;
        }

        const filteredProducts = allProducts.filter(function(product) {
            const name = (product.name || "").toLowerCase();
            const description =
                (product.description || "").toLowerCase();

            return name.includes(searchText) ||
                description.includes(searchText);
        });

        displayProducts(filteredProducts);
    }


    // Clear search.
    function clearSearch() {
        document.getElementById("searchInput").value = "";
        displayProducts(allProducts);
    }


    document.getElementById("searchInput")
        .addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                searchProducts();
            }
        });


    // Add a product to the buyer's cart.
    async function addToCart(productId, button) {
        button.disabled = true;
        button.textContent = "Adding...";

        try {
            const response = await fetch("/cart", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    buyer_id: Number(buyerId),
                    product_id: Number(productId),
                    quantity: 1
                })
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                alert(data.message || "Unable to add product.");
                return;
            }

            alert("Product added to cart.");

            window.location.href = "buyer-cart.html";

        } catch (error) {
            console.error(error);
            alert("Cannot connect to backend.");
        } finally {
            button.disabled = false;
            button.textContent = "Add to Cart";
        }
    }
</script>

</body>
</html>
