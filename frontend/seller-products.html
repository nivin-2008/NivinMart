<!DOCTYPE html>
<html>
<head>
    <title>My Products - NivinMart</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .back-button {
            display: block;
            margin: 0 auto 30px auto;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            background: #333;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .product {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
        }

        .product h2 {
            margin-top: 0;
        }

        .product p {
            margin: 8px 0;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .edit-button,
        .delete-button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .edit-button {
            background: #333;
        }

        .delete-button {
            background: #b00020;
        }

        .edit-button:hover {
            background: #555;
        }

        .delete-button:hover {
            background: #8b0019;
        }

        #message {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>My Products</h1>

    <button
        class="back-button"
        onclick="window.location.href='seller-add-product.html'">
        Back to Add Product
    </button>

    <div id="products"></div>

    <p id="message"></p>

</div>

<script>

    const sellerId = localStorage.getItem("sellerId");

    if (!sellerId) {
        window.location.href = "seller-login.html";
    }

    async function loadProducts() {

        try {

            const response = await fetch(
                "/seller/products?seller_id=" + sellerId
            );

            const data = await response.json();

            const productsDiv =
                document.getElementById("products");

            const message =
                document.getElementById("message");

            productsDiv.innerHTML = "";
            message.innerText = "";

            if (!data.success) {

                message.innerText =
                    data.message || "Failed to load products.";

                return;
            }

            if (!data.products || data.products.length === 0) {

                message.innerText =
                    "No products added yet.";

                return;
            }

            data.products.forEach(function(product) {

                const div = document.createElement("div");

                div.className = "product";

                const title = document.createElement("h2");
                title.innerText = product.name;

                const description = document.createElement("p");
                description.innerHTML =
                    "<strong>Description:</strong> " +
                    (product.description || "No description");

                const price = document.createElement("p");
                price.innerHTML =
                    "<strong>Price:</strong> ₹" + product.price;

                const stock = document.createElement("p");
                stock.innerHTML =
                    "<strong>Stock:</strong> " + product.stock;

                const actions = document.createElement("div");
                actions.className = "actions";

                const editButton =
                    document.createElement("button");

                editButton.className = "edit-button";
                editButton.innerText = "Edit Product";

                editButton.addEventListener(
                    "click",
                    function() {
                        editProduct(product);
                    }
                );

                const deleteButton =
                    document.createElement("button");

                deleteButton.className = "delete-button";
                deleteButton.innerText = "Delete Product";

                deleteButton.addEventListener(
                    "click",
                    function() {
                        deleteProduct(product.id);
                    }
                );

                actions.appendChild(editButton);
                actions.appendChild(deleteButton);

                div.appendChild(title);
                div.appendChild(description);
                div.appendChild(price);
                div.appendChild(stock);
                div.appendChild(actions);

                productsDiv.appendChild(div);
            });

        } catch (error) {

            document.getElementById("message").innerText =
                "Server error.";
        }
    }

    async function editProduct(product) {

        const newName = prompt(
            "Product Name:",
            product.name
        );

        if (newName === null) {
            return;
        }

        const newDescription = prompt(
            "Description:",
            product.description || ""
        );

        if (newDescription === null) {
            return;
        }

        const newPrice = prompt(
            "Price:",
            product.price
        );

        if (newPrice === null) {
            return;
        }

        const newStock = prompt(
            "Stock:",
            product.stock
        );

        if (newStock === null) {
            return;
        }

        if (newName.trim() === "") {
            alert("Product name is required.");
            return;
        }

        if (Number(newPrice) < 0 || Number(newStock) < 0) {
            alert("Price and stock cannot be negative.");
            return;
        }

        try {

            const response = await fetch(
                "/products/" + product.id,
                {
                    method: "PUT",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        name: newName.trim(),
                        description: newDescription.trim(),
                        price: Number(newPrice),
                        stock: Number(newStock)
                    })
                }
            );

            const data = await response.json();

            if (data.success) {

                alert("Product updated successfully!");

                loadProducts();

            } else {

                alert(
                    data.message ||
                    "Failed to update product."
                );
            }

        } catch (error) {

            alert("Server error.");
        }
    }

    async function deleteProduct(productId) {

        const confirmDelete = confirm(
            "Are you sure you want to delete this product?"
        );

        if (!confirmDelete) {
            return;
        }

        try {

            const response = await fetch(
                "/products/" + productId,
                {
                    method: "DELETE"
                }
            );

            const data = await response.json();

            if (data.success) {

                alert("Product deleted successfully!");

                loadProducts();

            } else {

                alert(
                    data.message ||
                    "Failed to delete product."
                );
            }

        } catch (error) {

            alert("Server error.");
        }
    }

    loadProducts();

</script>

</body>
</html>
