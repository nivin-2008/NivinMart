<!DOCTYPE html>
<html>
<head>
    <title>Admin Login - NivinMart</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            width: 400px;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        #message {
            margin-top: 15px;
            color: #b00020;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Admin Login</h1>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Admin Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p id="message"></p>

</div>

<script>

    document.getElementById("loginForm").addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            try {

                const response = await fetch("/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (data.success) {

                    if (data.role !== "admin") {

                        document.getElementById("message").innerText =
                            "This account is not an admin account.";

                        return;
                    }

                    localStorage.setItem(
                        "adminId",
                        data.id
                    );

                    localStorage.setItem(
                        "adminName",
                        data.name
                    );

                    localStorage.setItem(
                        "adminEmail",
                        data.email
                    );

                    window.location.href =
                        "admin-dashboard.html";

                } else {

                    document.getElementById("message").innerText =
                        data.message || "Invalid login details.";
                }

            } catch (error) {

                document.getElementById("message").innerText =
                    "Server error.";
            }
        }
    );

</script>

</body>
</html>
