<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Products - NivinMart</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 { margin-bottom: 8px; }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }

        a, button {
            display: inline-block;
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .back { background: #263b80; color: white; }
        .edit { background: #1769aa; color: white; }
        .delete { background: #c62828; color: white; }
        .save { background: #218838; color: white; }
        .cancel { background: #666; color: white; }

        #message {
            margin: 14px 0;
            padding: 10px;
            border-radius: 6px;
            white-space: pre-wrap;
        }

        .product {
            background: white;
            padding: 18px;
            margin-bottom: 14px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #00000012;
        }

        .product h3 { margin-top: 0; }

        .product-image {
            width: 150px;
            height: 120px;
            object-fit: contain;
            display: block;
            margin-bottom: 12px;
        }

        .product p { margin: 8px 0; }

        .details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            margin-bottom: 14px;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .edit-form {
            display: grid;
            gap: 10px;
            margin-top: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #bbb;
            border-radius: 6px;
            font: inherit;
        }

        textarea { min-height: 75px; }

        .hidden { display: none; }

        @media (max-width: 600px) {
            body { padding: 14px; }
        }
    </style>
</head>

<body>
<div class="container">
    <div class="topbar">
        <div>
            <h1>My Products</h1>
            <p>View, edit and delete your products.</p>
        </div>

        <a class="back" href="seller-add-product.html">
            Back to Add Product
        </a>
    </div>

    <div id="message">Loading products...</div>
    <div id="productsContainer"></div>
</div>

<script>
    const sellerId = localStorage.getItem("sellerId");
    const container = document.getElementById("productsContainer");
    const message = document.getElementById("message");

    function showMessage(text, isError = false) {
        message.textContent = text;
        message.style.background = isError ? "#ffe1e1" : "#e2f4e7";
        message.style.color = isError ? "#8b0000" : "#155724";
    }

    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, ch => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[ch]));
    }

    async function readResponse(response) {
        const text = await response.text();

        try {
            return JSON.parse(text);
        } catch {
            throw new Error(
                "Backend JSON response return pannala. HTTP " +
                response.status
            );
        }
    }

    async function loadProducts() {
        container.innerHTML = "";

        if (
            !sellerId ||
            !Number.isInteger(Number(sellerId)) ||
            Number(sellerId) <= 0
        ) {
            showMessage(
                "Seller ID kidaikkala. Logout panni seller account-la login pannunga.",
                true
            );
            return;
        }

        showMessage("Loading products...");

        try {
            const response = await fetch(
                "/seller/products?seller_id=" +
                encodeURIComponent(sellerId),
                { cache: "no-store" }
            );

            const data = await readResponse(response);

            if (!response.ok || data.success !== true) {
                throw new Error(
                    data.message || "Products load aagala."
                );
            }

            if (
                !Array.isArray(data.products) ||
                data.products.length === 0
            ) {
                showMessage("No products found for this seller.");
                return;
            }

            showMessage("Total products: " + data.products.length);

            data.products.forEach(product => {
                const card = document.createElement("section");
                card.className = "product";

                card.innerHTML = `
                    <h3>${escapeHTML(product.name)}</h3>

                    <div class="details">
                        <div>
                            <strong>Product ID:</strong>
                            ${escapeHTML(product.id)}
                        </div>
                        <div>
                            <strong>Price:</strong>
                            ₹${escapeHTML(product.price)}
                        </div>
                        <div>
                            <strong>Stock:</strong>
                            ${escapeHTML(product.stock)}
                        </div>
                    </div>

                    <p>
                        <strong>Description:</strong>
                        ${escapeHTML(product.description || "No description")}
                    </p>

                    <div class="actions">
                        <button class="edit" type="button">
                            Edit Product
                        </button>
                        <button class="delete" type="button">
                            Delete Product
                        </button>
                    </div>

                    <form class="edit-form hidden">
                        <label>
                            Product name
                            <input name="name" required maxlength="200">
                        </label>

                        <label>
                            Description
                            <textarea name="description"></textarea>
                        </label>

                        <label>
                            Price
                            <input
                                name="price"
                                type="number"
                                min="0"
                                step="0.01"
                                required
                            >
                        </label>

                        <label>
                            Stock
                            <input
                                name="stock"
                                type="number"
                                min="0"
                                step="1"
                                required
                            >
                        </label>

                        <div class="actions">
                            <button class="save" type="submit">
                                Save Changes
                            </button>
                            <button class="cancel" type="button">
                                Cancel
                            </button>
                        </div>
                    </form>
                `;

                const editButton = card.querySelector(".edit");
                const deleteButton = card.querySelector(".delete");
                const form = card.querySelector(".edit-form");

                if (product.image_data) {
                    const image = document.createElement("img");
                    image.className = "product-image";
                    image.src = product.image_data;
                    image.alt = product.name || "Product photo";
                    card.prepend(image);
                }

                editButton.addEventListener("click", () => {
                    form.elements.name.value = product.name || "";
                    form.elements.description.value =
                        product.description || "";
                    form.elements.price.value = product.price;
                    form.elements.stock.value = product.stock;

                    form.classList.toggle("hidden");
                });

                form.querySelector(".cancel").addEventListener(
                    "click",
                    () => {
                        form.classList.add("hidden");
                    }
                );

                form.addEventListener("submit", async event => {
                    event.preventDefault();

                    const name = form.elements.name.value.trim();
                    const description =
                        form.elements.description.value.trim();
                    const price = Number(form.elements.price.value);
                    const stock = Number(form.elements.stock.value);

                    if (
                        !name ||
                        !Number.isFinite(price) ||
                        price < 0 ||
                        !Number.isInteger(stock) ||
                        stock < 0
                    ) {
                        alert("Correct product details enter pannunga.");
                        return;
                    }

                    const saveButton = form.querySelector(".save");
                    saveButton.disabled = true;
                    saveButton.textContent = "Saving...";

                    try {
                        const response = await fetch(
                            "/products/" +
                            encodeURIComponent(product.id),
                            {
                                method: "PUT",
                                headers: {
                                    "Content-Type": "application/json"
                                },
                                body: JSON.stringify({
                                    seller_id: Number(sellerId),
                                    name,
                                    description,
                                    price,
                                    stock
                                })
                            }
                        );

                        const data = await readResponse(response);

                        if (!response.ok || data.success !== true) {
                            throw new Error(
                                data.message || "Product update aagala."
                            );
                        }

                        showMessage("Product updated successfully.");
                        await loadProducts();

                    } catch (error) {
                        showMessage(
                            error.message || "Product update aagala.",
                            true
                        );
                    } finally {
                        saveButton.disabled = false;
                        saveButton.textContent = "Save Changes";
                    }
                });

                deleteButton.addEventListener("click", async () => {
                    const confirmed = confirm(
                        `"${product.name}" product-ai database-lendhu delete pannava?`
                    );

                    if (!confirmed) return;

                    deleteButton.disabled = true;
                    deleteButton.textContent = "Deleting...";

                    try {
                        const response = await fetch(
                            "/products/" +
                            encodeURIComponent(product.id) +
                            "?seller_id=" +
                            encodeURIComponent(sellerId),
                            { method: "DELETE" }
                        );

                        const data = await readResponse(response);

                        if (!response.ok || data.success !== true) {
                            throw new Error(
                                data.message || "Product delete aagala."
                            );
                        }

                        showMessage(
                            "Product database-lendhu delete aayiduchu."
                        );

                        await loadProducts();

                    } catch (error) {
                        showMessage(
                            error.message || "Product delete aagala.",
                            true
                        );

                        deleteButton.disabled = false;
                        deleteButton.textContent = "Delete Product";
                    }
                });

                container.appendChild(card);
            });

        } catch (error) {
            console.error("My Products error:", error);
            showMessage(
                error.message ||
                "Products load aagala. Backend check pannunga.",
                true
            );
        }
    }

    loadProducts();
</script>
</body>
</html>
