<!DOCTYPE html>
<html>
<head>
    <title>Admin - Users - NivinMart</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .back-button {
            display: block;
            margin: 0 auto 25px auto;
            padding: 11px 20px;
            border: none;
            border-radius: 6px;
            background: #333;
            color: white;
            cursor: pointer;
        }

        .user {
            background: white;
            padding: 18px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .user p {
            margin: 7px 0;
        }

        #message {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>All Users</h1>

    <button
        class="back-button"
        onclick="window.location.href='admin-dashboard.html'">
        Back to Admin Dashboard
    </button>

    <div id="users"></div>

    <p id="message"></p>

</div>

<script>

    const adminId = localStorage.getItem("adminId");

    if (!adminId) {
        window.location.href = "admin-login.html";
    }

    async function loadUsers() {

        try {

            const response = await fetch("/admin/users");

            const data = await response.json();

            const usersDiv =
                document.getElementById("users");

            const message =
                document.getElementById("message");

            usersDiv.innerHTML = "";
            message.innerText = "";

            if (!data.success) {
                message.innerText =
                    data.message || "Failed to load users.";
                return;
            }

            if (!data.users || data.users.length === 0) {
                message.innerText = "No users found.";
                return;
            }

            data.users.forEach(function(user) {

                const div = document.createElement("div");

                div.className = "user";

                div.innerHTML = `
                    <p><strong>ID:</strong> ${user.id}</p>
                    <p><strong>Name:</strong> ${user.name}</p>
                    <p><strong>Email:</strong> ${user.email}</p>
                    <p><strong>Role:</strong> ${user.role}</p>
                `;

                usersDiv.appendChild(div);
            });

        } catch (error) {

            document.getElementById("message").innerText =
                "Server error.";
        }
    }

    loadUsers();

</script>

</body>
</html>
