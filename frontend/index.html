<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NivinMart</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            min-height: 100vh;
        }

        header {
            background: #111827;
            color: white;
            padding: 25px 40px;
            text-align: center;
        }

        header h1 {
            font-size: 34px;
            margin-bottom: 8px;
        }

        header p {
            color: #d1d5db;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 50px auto;
        }

        .welcome {
            text-align: center;
            font-size: 30px;
            margin-bottom: 40px;
            color: #222;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 25px;
        }

        .card {
            background: white;
            padding: 35px 25px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            font-size: 26px;
            margin-bottom: 15px;
            color: #222;
        }

        .card p {
            color: #666;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .card button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #111827;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .card button:hover {
            background: #1f2937;
        }

        @media (max-width: 750px) {
            .cards {
                grid-template-columns: 1fr;
            }

            .welcome {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>NivinMart</h1>
        <p>Online Shopping Marketplace</p>
    </header>

    <div class="container">

        <h2 class="welcome">Welcome to NivinMart</h2>

        <div class="cards">

            <div class="card">
                <h2>Buyer</h2>
                <p>Shop products and place orders</p>
                <button onclick="location.href='buyer-register.html'">
                    Buyer
                </button>
            </div>

            <div class="card">
                <h2>Seller</h2>
                <p>Manage and sell products</p>
                <button onclick="location.href='seller-register.html'">
                    Seller
                </button>
            </div>

            <div class="card">
                <h2>Admin</h2>
                <p>Manage NivinMart products</p>
                <button onclick="location.href='admin-login.html'">
                    Admin Login
                </button>
            </div>

        </div>
    </div>

</body>
</html>
