<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard - NivinMart</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 50px auto;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        #welcome {
            color: #666;
            margin-bottom: 35px;
        }

        .options {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            width: 260px;
            padding: 30px 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .card h2 {
            margin-bottom: 10px;
        }

        .card p {
            color: #777;
        }

        .logout {
            margin-top: 30px;
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            background: #b00020;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>NivinMart Admin Dashboard</h1>

    <p id="welcome"></p>

    <div class="options">

        <div class="card"
             onclick="window.location.href='admin-users.html'">
            <h2>View Users</h2>
            <p>View all registered users</p>
        </div>

        <div class="card"
             onclick="window.location.href='admin-orders.html'">
            <h2>View Orders</h2>
            <p>View all customer orders</p>
        </div>

        <div class="card"
             onclick="window.location.href='admin-products.html'">
            <h2>Manage Products</h2>
            <p>View and delete products</p>
        </div>

    </div>

    <button class="logout" onclick="logout()">
        Logout
    </button>

</div>

<script>

    const adminId = localStorage.getItem("adminId");
    const adminName = localStorage.getItem("adminName");

    if (!adminId) {
        window.location.href = "admin-login.html";
    }

    document.getElementById("welcome").innerText =
        "Welcome, " + (adminName || "Admin");

    function logout() {

        localStorage.removeItem("adminId");
        localStorage.removeItem("adminName");
        localStorage.removeItem("adminEmail");

        window.location.href = "index.html";
    }

</script>

</body>
</html>
