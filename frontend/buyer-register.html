<!DOCTYPE html>
<html>
<head>
    <title>Buyer Registration - NivinMart</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            width: 400px;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
            color: #333;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Buyer Registration</h1>

    <form id="registerForm">

        <input
            type="text"
            id="name"
            placeholder="Name"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Register
        </button>

    </form>

    <p id="message"></p>

</div>

<script>
    document.getElementById("registerForm").addEventListener("submit", async function(event) {

        event.preventDefault();

        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        try {

            const response = await fetch("/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name: name,
                    email: email,
                    password: password,
                    role: "buyer"
                })
            });

            const data = await response.json();

            if (data.success) {

                document.getElementById("message").innerText =
                    "Registration successful!";

                setTimeout(function() {
                    window.location.href = "buyer-login.html";
                }, 1000);

            } else {

                if (data.message === "Email already registered") {

                    window.location.href = "buyer-login.html";

                } else {

                    document.getElementById("message").innerText =
                        data.message || "Registration failed.";
                }
            }

        } catch (error) {

            document.getElementById("message").innerText =
                "Server error.";
        }

    });
</script>

</body>
</html>
