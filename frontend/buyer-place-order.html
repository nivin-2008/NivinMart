```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Order - NivinMart</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            min-height: 100vh;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px 40px;
        }

        header h1 {
            font-size: 28px;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
        }

        .box {
            background: white;

            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);

            display: flex;

        .total {
            display: flex;

            font-size: 22px;

        }

        .confirm {
            margin-top: 25px;

            border-radius: 10px;
        }

        .confirm input {
            margin-right: 8px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #111827;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            color: #555;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
    <header>
        <h1>NivinMart</h1>
    </header>

    <div class="container">
        <div class="box">
            <h2>Order Summary</h2>

            <div id="itemsContainer">Loading cart...</div>

            <div class="total">
                <span>Total</span>
                <span id="totalAmount">₹0.00</span>
            </div>

            <div class="confirm">
                <label>
                    <input type="checkbox" id="confirmOrder">
                    I confirm this order
                </label>
            </div>

            <button id="placeOrderButton" onclick="placeOrder()" disabled>
                Place Order
            </button>

            <p id="message"></p>
        </div>
    </div>

    <script>
        const API_BASE = "https://nivinmart-1.onrender.com";
        const buyerId = localStorage.getItem("buyerId");

        const container = document.getElementById("itemsContainer");
        const totalAmount = document.getElementById("totalAmount");
        const message = document.getElementById("message");
        const orderButton = document.getElementById("placeOrderButton");

        let cartItems = [];
        let cartLoaded = false;
        let orderInProgress = false;

        if (!buyerId || !Number.isFinite(Number(buyerId))) {
            window.location.href = "buyer-login.html";
        }

        async function apiFetch(path, options = {}) {
            return fetch(API_BASE + path, options);
        }

        async function loadCart() {
            cartLoaded = false;
            orderButton.disabled = true;
            container.textContent = "Loading cart...";
            message.textContent = "";
            totalAmount.textContent = "₹0.00";

            try {
                const response = await apiFetch(
                    "/cart?buyer_id=" + encodeURIComponent(buyerId)
                );

                if (!response.ok) {
                    throw new Error(
                        "Cart API returned HTTP " + response.status
                    );
                }

                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.message || "Unable to load cart");
                }

                cartItems = data.cart || data.items || [];

                if (!Array.isArray(cartItems) || cartItems.length === 0) {
                    container.textContent = "Your cart is empty.";
                    return;
                }

                container.innerHTML = "";
                let total = 0;

                cartItems.forEach(item => {
                    const name = item.name || item.product_name || "Product";
                    const price = Number(item.price);
                    const quantity = Number(item.quantity);

                    if (
                        !Number.isFinite(price) ||
                        !Number.isFinite(quantity) ||
                        price < 0 ||
                        quantity < 1
                    ) {
                        throw new Error("Invalid product price or quantity");
                    }

                    const subtotal = price * quantity;
                    total += subtotal;

                    const div = document.createElement("div");
                    div.className = "item";

                    const itemName = document.createElement("span");
                    itemName.textContent = name + " × " + quantity;

                    const itemPrice = document.createElement("span");
                    itemPrice.textContent = "₹" + subtotal.toFixed(2);

                    div.append(itemName, itemPrice);
                    container.appendChild(div);
                });

                totalAmount.textContent = "₹" + total.toFixed(2);
                cartLoaded = true;
                orderButton.disabled = false;

            } catch (error) {
                console.error("Load cart error:", error);
                cartItems = [];
                container.textContent =
                    "Cannot connect to backend. Please refresh and try again.";
                message.textContent = error.message;
            }
        }

        async function placeOrder() {
            if (orderInProgress) {
                return;
            }

            if (!cartLoaded || cartItems.length === 0) {
                message.textContent =
                    "Cart is empty or could not be loaded.";
                return;
            }

            if (!document.getElementById("confirmOrder").checked) {
                message.textContent = "Please confirm your order.";
                return;
            }

            orderInProgress = true;
            orderButton.disabled = true;
            message.textContent = "Placing order...";

            try {
                const response = await apiFetch("/orders", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        buyer_id: Number(buyerId)
                    })
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(
                        data.message ||
                        "Order failed. HTTP status: " + response.status
                    );
                }

                message.textContent =
                    "Order placed successfully! Order ID: " +
                    (data.order_id ?? "Confirmed");

                setTimeout(() => {
                    window.location.href = "buyer-products.html";
                }, 2000);

            } catch (error) {
                console.error("Place order error:", error);
                message.textContent = "Order failed: " + error.message;
                orderInProgress = false;
                orderButton.disabled = false;
            }
        }

        if (buyerId) {
            loadCart();
        }
    </script>
</body>
</html>
