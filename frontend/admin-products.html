<!DOCTYPE html>
<html>
<head>
    <title>Admin - Manage Products - NivinMart</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .back-button {
            display: block;
            margin: 0 auto 25px auto;
            padding: 11px 20px;
            border: none;
            border-radius: 6px;
            background: #333;
            color: white;
            cursor: pointer;
        }

        .product {
            background: white;
            padding: 20px;
            margin-bottom: 18px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.10);
        }

        .product h2 {
            margin-top: 0;
        }

        .product p {
            margin: 8px 0;
        }

        .delete-button {
            margin-top: 15px;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background: #b00020;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .delete-button:hover {
            background: #8b0019;
        }

        #message {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Manage Products</h1>

    <button
        class="back-button"
        onclick="window.location.href='admin-dashboard.html'">
        Back to Admin Dashboard
    </button>

    <div id="products"></div>

    <p id="message"></p>

</div>

<script>

    const adminId = localStorage.getItem("adminId");

    if (!adminId) {
        window.location.href = "admin-login.html";
    }

    async function loadProducts() {

        try {

            const response = await fetch("/products");

            const data = await response.json();

            const productsDiv =
                document.getElementById("products");

            const message =
                document.getElementById("message");

            productsDiv.innerHTML = "";
            message.innerText = "";

            if (!data.success) {
                message.innerText =
                    data.message || "Failed to load products.";
                return;
            }

            if (!data.products || data.products.length === 0) {
                message.innerText = "No products found.";
                return;
            }

            data.products.forEach(function(product) {

                const div = document.createElement("div");

                div.className = "product";

                div.innerHTML = `
                    <h2>${product.name}</h2>

                    <p>
                        <strong>Product ID:</strong>
                        ${product.id}
                    </p>

                    <p>
                        <strong>Seller ID:</strong>
                        ${product.seller_id}
                    </p>

                    <p>
                        <strong>Description:</strong>
                        ${product.description || "No description"}
                    </p>

                    <p>
                        <strong>Price:</strong>
                        ₹${product.price}
                    </p>

                    <p>
                        <strong>Stock:</strong>
                        ${product.stock}
                    </p>

                    <button
                        class="delete-button"
                        onclick="deleteProduct(${product.id})">
                        Delete Product
                    </button>
                `;

                productsDiv.appendChild(div);
            });

        } catch (error) {

            document.getElementById("message").innerText =
                "Server error.";
        }
    }

    async function deleteProduct(productId) {

        const confirmDelete = confirm(
            "Are you sure you want to delete this product?"
        );

        if (!confirmDelete) {
            return;
        }

        try {

            const response = await fetch(
                "/admin/products/" + productId,
                {
                    method: "DELETE"
                }
            );

            const data = await response.json();

            if (data.success) {

                alert("Product deleted successfully!");

                loadProducts();

            } else {

                alert(
                    data.message ||
                    "Failed to delete product."
                );
            }

        } catch (error) {

            alert("Server error.");
        }
    }

    loadProducts();

</script>

</body>
</html>
