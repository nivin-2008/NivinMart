<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyer Login - NivinMart</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
        }

        .login-box {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 9px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #111827;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1f2937;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .register-link {
            margin-top: 18px;
            text-align: center;
            color: #555;
        }

        .register-link a {
            color: #111827;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Buyer Login</h1>

        <p class="subtitle">
            Login to your NivinMart account
        </p>

        <form id="loginForm">

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

        <p class="register-link">
            Don't have an account?
            <a href="buyer-register.html">Register</a>
        </p>

    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const message = document.getElementById("message");

            message.textContent = "Logging in...";

            try {

                const response = await fetch("http://localhost:5555/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (data.success) {

                    localStorage.setItem("buyerId", data.id);
                    localStorage.setItem("buyerName", data.name);
                    localStorage.setItem("buyerEmail", data.email);

                    message.textContent = "Login successful!";

                    setTimeout(() => {
                        window.location.href = "buyer-products.html";
                    }, 1000);

                } else {

                    message.textContent =
                        data.message || "Invalid email or password";

                }

            } catch (error) {

                console.error(error);
                message.textContent = "Cannot connect to backend";

            }

        });
    </script>

</body>
</html>
