<!DOCTYPE html>
<html>
<head>
    <title>Seller Login - NivinMart</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            width: 400px;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Seller Login</h1>

    <form id="loginForm">

        <label for="email">Email</label>
        <input type="email" id="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" required>

        <button type="submit">Login</button>

    </form>

    <p id="message"></p>

</div>

<script>
    document.getElementById("loginForm").addEventListener("submit", async function(e) {

        e.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        try {

            const response = await fetch("/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            });

            const data = await response.json();

            if (data.success) {

                if (data.role !== "seller") {
                    document.getElementById("message").innerText =
                        "This account is not a seller account.";
                    return;
                }

                localStorage.setItem("sellerId", data.id);
                localStorage.setItem("sellerName", data.name);
                localStorage.setItem("sellerEmail", data.email);

                window.location.href = "seller-dashboard.html";

            } else {

                document.getElementById("message").innerText =
                    data.message || "Login failed.";
            }

        } catch (error) {

            document.getElementById("message").innerText =
                "Server error. Please try again.";
        }
    });
</script>

</body>
</html>
