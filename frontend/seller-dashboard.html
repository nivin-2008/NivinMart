<!DOCTYPE html>
<html>
<head>
    <title>Seller Dashboard - NivinMart</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            width: 450px;
            padding: 35px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        #welcome {
            margin-bottom: 30px;
            color: #555;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: none;
            border-radius: 6px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>NivinMart Seller Dashboard</h1>

    <h2 id="welcome"></h2>

    <button onclick="window.location.href='seller-add-product.html'">
        Add Product
    </button>

    <button onclick="window.location.href='seller-products.html'">
        My Products
    </button>

    <button onclick="window.location.href='seller-orders.html'">
        My Orders
    </button>

    <button onclick="logout()">
        Logout
    </button>

</div>

<script>

    const sellerName = localStorage.getItem("sellerName");

    if (!sellerName) {

        window.location.href = "seller-login.html";

    } else {

        document.getElementById("welcome").innerText =
            "Welcome, " + sellerName;

    }


    function logout() {

        localStorage.removeItem("sellerId");
        localStorage.removeItem("sellerName");
        localStorage.removeItem("sellerEmail");

        window.location.href = "index.html";
    }

</script>

</body>
</html>
